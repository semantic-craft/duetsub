<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="manifest.open_in_tab" content="true" />
    <title>DuetSub 設定</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; background: Canvas; color: CanvasText; }
      main { max-width: 42rem; margin: 3rem auto; padding: 0 1.5rem; }
      form { display: grid; gap: 1rem; }
      .field { display: grid; gap: .35rem; }
      input, select, button { box-sizing: border-box; min-height: 2.5rem; padding: .55rem .7rem; font: inherit; }
      .actions { display: flex; gap: .75rem; }
      output { display: block; min-height: 1.5rem; margin-top: 1rem; }
      section { margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 1px solid color-mix(in srgb, CanvasText 18%, transparent); }
      section output { margin: .5rem 0 1rem; }
      output[data-state="success"] { color: #218739; }
      output[data-state="error"] { color: #c43b36; }
      .fixed { opacity: .75; }
    </style>
  </head>
  <body>
    <main>
      <h1 data-i18n="options.heading">DuetSub 設定</h1>
      <p data-i18n="options.intro">字幕只會傳送到你在此設定並授權的端點。</p>
      <section>
        <label class="field">
          <span data-i18n="options.interfaceLanguage">介面語言</span>
          <select id="ui-language">
            <option value="zh-Hans">简体中文</option>
            <option value="zh-Hant">繁體中文</option>
            <option value="en">English</option>
          </select>
        </label>
      </section>
      <section aria-labelledby="official-language-pair-heading">
        <h2 id="official-language-pair-heading" data-i18n="options.officialHeading">官方字幕語言</h2>
        <output id="official-language-pair" data-i18n="options.loadingPreference">正在讀取本機偏好…</output>
        <p class="fixed" data-i18n="options.officialHelp">實際可用語言只由播放中的當前節目決定，請在播放器內長按或右鍵 DuetSub 按鈕選擇。</p>
        <button id="reset-official-language-pair" type="button" data-i18n="options.resetPair">恢復英文在上、繁體中文在下</button>
      </section>
      <form>
        <label class="field"><span data-i18n="options.provider">供應商</span>
          <select id="provider">
            <option value="deepseek">DeepSeek</option>
            <option value="openai-compatible" data-i18n="options.openAiCompatible">OpenAI 兼容</option>
            <option value="local" data-i18n="options.localOpenAiCompatible">本地 OpenAI 兼容</option>
          </select>
        </label>
        <label class="field"><span data-i18n="options.baseUrl">Base URL</span>
          <input id="base-url" type="url" required autocomplete="url">
        </label>
        <label class="field"><span data-i18n="options.apiKey">API key</span>
          <input id="api-key" type="password" autocomplete="off" spellcheck="false">
        </label>
        <label class="field"><span data-i18n="options.model">模型</span>
          <input id="model" required autocomplete="off" spellcheck="false" list="deepseek-models">
          <datalist id="deepseek-models">
            <option value="deepseek-v4-flash"></option>
            <option value="deepseek-v4-pro"></option>
          </datalist>
        </label>
        <p class="fixed" data-i18n="options.fallbackTarget">翻譯 fallback 目標：繁體中文 / 英文（與手動官方語言對分離）</p>
        <div class="actions">
          <button type="submit" data-i18n="options.save">儲存</button>
          <button id="test" type="button" data-i18n="options.test">測試連線</button>
        </div>
      </form>
      <output id="status" role="status" data-i18n="options.notTested">尚未測試</output>
    </main>
    <script type="module" src="../src/options/page.ts"></script>
  </body>
</html>
