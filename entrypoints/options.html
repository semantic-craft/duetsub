<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="manifest.open_in_tab" content="true" />
    <title>DuetSub 設定</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; background: Canvas; color: CanvasText; }
      main { max-width: 42rem; margin: 3rem auto; padding: 0 1.5rem; }
      form { display: grid; gap: 1rem; }
      .field { display: grid; gap: .35rem; }
      input, select, button { box-sizing: border-box; min-height: 2.5rem; padding: .55rem .7rem; font: inherit; }
      .field > span { display: flex; align-items: center; gap: .5rem; }
      input[type="checkbox"] { width: 1rem; min-height: 1rem; padding: 0; }
      .actions { display: flex; gap: .75rem; }
      output { display: block; min-height: 1.5rem; margin-top: 1rem; }
      section { margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 1px solid color-mix(in srgb, CanvasText 18%, transparent); }
      section output { margin: .5rem 0 1rem; }
      output[data-state="success"] { color: #218739; }
      output[data-state="error"] { color: #c43b36; }
      .fixed { opacity: .75; }
    </style>
  </head>
  <body>
    <main>
      <h1>DuetSub 設定</h1>
      <p>字幕只會傳送到你在此設定並授權的端點。</p>
      <section aria-labelledby="official-language-pair-heading">
        <h2 id="official-language-pair-heading">官方字幕語言</h2>
        <output id="official-language-pair">正在讀取本機偏好…</output>
        <p class="fixed">實際可用語言只由播放中的當前節目決定，請在播放器內長按或右鍵 DuetSub 按鈕選擇。</p>
        <button id="reset-official-language-pair" type="button">恢復英文在上、繁體中文在下</button>
      </section>
      <form>
        <label class="field">供應商
          <select id="provider">
            <option value="deepseek">DeepSeek</option>
            <option value="qwen-cn">千問（阿里雲百煉·中國區）</option>
            <option value="qwen-sg">千問（阿里雲百煉·新加坡區）</option>
            <option value="doubao">豆包（火山方舟·中國區）</option>
            <option value="openai-compatible">OpenAI 兼容</option>
            <option value="local">本地 OpenAI 兼容</option>
          </select>
        </label>
        <label id="workspace-id-field" class="field" hidden>百煉 Workspace ID
          <input id="workspace-id" type="text" required autocomplete="off" spellcheck="false" placeholder="ws-…">
          <small>只需填寫 <code>ws-…</code>；DuetSub 會按所選地域自動建立 Responses API 位址。</small>
        </label>
        <label id="web-search-field" class="field" hidden>
          <span><input id="web-search" type="checkbox">允許千問按需聯網搜尋</span>
          <small>使用 Responses API 的 <code>web_search</code> 工具並開啟低強度思考；模型自行決定是否搜尋，可能增加延遲與費用，預設關閉。</small>
        </label>
        <label class="field">Base URL
          <input id="base-url" type="url" required autocomplete="url">
        </label>
        <label class="field">API key
          <input id="api-key" type="password" autocomplete="off" spellcheck="false">
        </label>
        <label class="field">模型（可選或手動輸入）
          <input id="model" required autocomplete="off" spellcheck="false" list="deepseek-models">
          <datalist id="deepseek-models">
            <option value="deepseek-v4-flash"></option>
            <option value="deepseek-v4-pro"></option>
          </datalist>
          <datalist id="qwen-models">
            <option value="qwen3.7-flash"></option>
            <option value="qwen3.7-plus"></option>
            <option value="qwen3.7-max"></option>
            <option value="qwen3.6-flash"></option>
          </datalist>
          <datalist id="doubao-models">
            <option value="doubao-seed-2-1-pro-260628"></option>
            <option value="doubao-seed-2-0-lite-260215"></option>
            <option value="doubao-seed-2-0-mini-260215"></option>
            <option value="doubao-seed-2-0-pro-260215"></option>
          </datalist>
        </label>
        <p class="fixed">翻譯 fallback 目標：繁體中文 / 英文（與手動官方語言對分離）</p>
        <div class="actions">
          <button type="submit">儲存</button>
          <button id="test" type="button">測試連線</button>
        </div>
      </form>
      <output id="status" role="status">尚未測試</output>
    </main>
    <script type="module" src="../src/options/page.ts"></script>
  </body>
</html>
