name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  chrome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release:build
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          archive=".output/duetsub-${version}-chrome.zip"
          notes="docs/releases/${RELEASE_TAG}.md"
          if [[ -f "$notes" ]]; then
            gh release create "$RELEASE_TAG" "$archive" \
              --verify-tag \
              --title "DuetSub $RELEASE_TAG" \
              --notes-file "$notes"
          else
            gh release create "$RELEASE_TAG" "$archive" \
              --verify-tag \
              --title "DuetSub $RELEASE_TAG" \
              --generate-notes
          fi
