<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DuetSub dynamic official language pair smoke</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        gap: 1rem;
        place-content: center;
        background: #101218;
        color: #f6f8fb;
        font-family: system-ui, sans-serif;
      }

      #movie_player {
        position: relative;
        width: min(960px, 96vw);
        aspect-ratio: 16 / 9;
        background: #000;
      }

      video {
        width: 100%;
        height: 100%;
      }

      .ytp-right-controls {
        position: absolute;
        right: 1rem;
        bottom: 0.75rem;
        z-index: 2;
        display: flex;
      }

      [data-duetsub-native-captions] {
        position: absolute;
        bottom: 20%;
        left: 50%;
        color: white;
        transform: translateX(-50%);
      }

      aside {
        max-width: 60rem;
        color: rgb(246 248 251 / 78%);
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body data-duetsub-official-catalog="ja,zh-Hans">
    <div id="movie_player">
      <video autoplay muted controls></video>
      <div data-duetsub-native-captions="youtube">Native captions placeholder</div>
      <div class="ytp-right-controls"></div>
    </div>
    <aside>
      右鍵或長按 DuetSub：選擇日本語在上、简体中文在下；交換上下後會立即重載。
      重新整理可驗證本機偏好恢復；到 Options 恢復預設後，本假目錄因沒有 en / zh-Hant
      會顯示缺軌提示並保持原生字幕可見。
    </aside>
    <script>
      const video = document.querySelector('video');
      const canvas = document.createElement('canvas');
      canvas.width = 960;
      canvas.height = 540;
      const context = canvas.getContext('2d');
      let hue = 215;

      function drawFrame() {
        hue = (hue + 0.15) % 360;
        context.fillStyle = `hsl(${hue} 42% 18%)`;
        context.fillRect(0, 0, canvas.width, canvas.height);
        context.fillStyle = 'rgb(255 255 255 / 70%)';
        context.font = '36px system-ui';
        context.textAlign = 'center';
        context.fillText('DuetSub dynamic official pair smoke', canvas.width / 2, canvas.height / 2);
        requestAnimationFrame(drawFrame);
      }

      drawFrame();
      video.srcObject = canvas.captureStream(30);
      void video.play();
    </script>
  </body>
</html>
